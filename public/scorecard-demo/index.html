e-height:1.5}.detail-metrics .metric{grid-template-columns:1fr auto;gap:10px;padding:14px 8px}.detail-metrics .track{grid-column:1/-1}.detail-metrics .chevron{display:none}.detail-metrics{background:white;padding:6px 12px;border:1px solid var(--line);border-radius:10px}.milestone{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}.milestone .marker{background:#e4eeef;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;color:var(--teal);flex-shrink:0;font-size:12px}.milestone small{display:block;color:#708192;margin-top:4px}.commitment{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:12px}.commitment h3{margin:10px 0}.commitment p{line-height:1.6;font-size:14px;color:#637589}.commitment .badge{margin-top:14px}.note{padding:14px 16px;background:#eaf2f5;color:#516b7b;border-radius:8px;font-size:13px;line-height:1.6;margin-top:24px}

<header class="topbar"><div class="brand"><svg width="39" height="39" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="#0c305c" stroke-width="1.5"/><path d="m25 10-2 13-13 7 7-13z" fill="#53b3a6"/><path d="m25 10-8 7 6 6z" fill="#0c305c"/><circle cx="20" cy="20" r="2" fill="white"/></svg><div><strong>Compass</strong><small>HDC MIDATLANTIC</small></div></div><div class="account"><div><strong>Chief Operating Officer</strong><small>Executive Leadership</small></div><span class="avatar">COO</span></div></header>
<main><div class="intro"><div><p class="eyebrow">Strategy & performance</p><h1>Enterprise scorecards</h1></div><span class="demo">PROTOTYPE · SAMPLE DATA</span></div>

<script>
// Standalone demonstration. No API, sign-in, storage, or database dependencies.
const statusLabels={good:'On track',watch:'Watch',risk:'Off track',pending:'Pending'};
const m=(name,actual,target,status,progress,rule='Higher is better')=>({name,actual,target,status,progress,rule});
const strategic=[
 {name:'Diversify & Innovate',status:'good',work:'Pipeline',strategies:['Rental Housing Production','Investment & Development','New Housing Models'],metrics:[m('Units created, acquired or preserved','420','750','good',56),m('Growth in new units (excl. acquisitions)','9%','>15%','watch',60),m('Enterprise capital for development','$0.9M','$1.5M','good',60),m('New housing models vetted','3','5–7','good',60,'Target range')]},
 {name:'Agility & Capability',status:'watch',work:'Talent Management',strategies:['Supportive Culture','Leadership','Future-Ready Operations'],metrics:[m('Employee satisfaction rate','82%','90%','watch',91),m('Employee net promoter score','38','>50','risk',76),m('Employee engagement rate','47%','>50%','watch',94),m('New technologies adopted','3','5','good',60)]},
 {name:'Sustainable Growth',status:'good',work:'Revenue',strategies:['Integrated Operations','Revenue & Community','Business Model'],metrics:[m('Days cash on hand','128 days','150 days','good',85),m('Brand visibility & reach score','71%','>80%','watch',89),m('Balanced revenue diversification','Pending','Pending','pending',0,'Target to be established'),m('Philanthropic growth vs. national average','Pending','Pending','pending',0,'Target to be established')]},
 {name:'Advocate for Change',status:'good',work:'Advocacy',strategies:['Advocacy Commitment','Advocacy Capital & Impact','Leadership & Board'],metrics:[m('Coalitions & alliances (active)','2','2–3','good',100,'Target range'),m('Resident leaders in advocacy','64','100','good',64),m('Policy wins','1','3','watch',33),m('Policymaker engagement increase','Pending','Pending','pending',0,'Target to be established')]},
 {name:'Care & Connection',status:'good',work:'Resident Impact',strategies:['Resident-Centered Culture','Resident Communication','Service Excellence'],metrics:[m('Resident satisfaction rate','88%','>85%','good',100),m('Resident experience score','55%','>60%','watch',92),m('Wage growth, working families','11%','>25%','good',44)]}
];
const annual=[
 {name:'Resident Impact',status:'good',metrics:[m('Resident services utilization rate','42%','60%','good',70),m('Resident experience score','83%','90%','good',92),m('Household engagement rate','24%','60%','good',40),m('Resident satisfaction rate','83%','85%','watch',98),m('Housing stability rate','99.8%','99%','good',100),m('Positive move-out rate','69%','80%','good',86),m('Service delivery partner connection rate','Pending','75%','pending',0)]},
 {name:'Financial Health',status:'risk',metrics:[m('Predevelopment capital raised','$500,000','$500,000','good',100),m('Accounts receivable balance','$2,264,725','$1,100,000 cap','risk',49,'Lower is better; bar shows target divided by actual'),m('Days cash on hand','44 days','110 days','risk',40),m('Net operating income','−$1,543,970','$20,000','risk',0,'Positive target; negative actual displayed without a progress ratio'),m('Current ratio','0.07','1.5','watch',5)]},
 {name:'Talent Management',status:'watch',metrics:[m('Employee satisfaction rate','81%','90%','watch',90),m('Employee engagement rate','35%','50%','watch',70),m('Employee retention rate (12-month)','62%','80%','risk',78)]},
 {name:'Pipeline',status:'good',metrics:[m('New units acquired or placed in service','199','351','good',57),m('Existing units rehabbed','0','175','risk',0),m('Units under development','143','368','good',39),m('Units in closing','95','95','good',100)]},
 {name:'Portfolio Performance',status:'watch',metrics:[m('Events of noncompliance','0','0','good',100,'Zero-event target met'),m('Rent collection rate','94%','98%','watch',96),m('Vacancy rate','2.24%','2.0% cap','watch',89,'Lower is better; bar shows target divided by actual'),m('Payment of deferred developer fee','$8,970','$50,000','good',18),m('Vacancy loss','$644,559','$720,000 cap','risk',90,'Ceiling consumption; a fuller bar means more of the loss allowance used')]},
 {name:'Brand Visibility',status:'watch',metrics:[m('Resident stories collected & shared','4','10','watch',40),m('Positive news mentions','12','50','watch',24),m('Brand visibility & reach score','68%','80%','watch',85)]},
 {name:'Revenue',status:'good',metrics:[m('Property management fee','$1,502,540','$2,585,528','good',58),m('Developer fee earned','$0','$1,627,500','risk',0),m('Contributed revenue','$853,806','$835,000','good',100),m('Excess cash to parent','$72,528','$104,500','watch',69)]},
 {name:'Advocacy',status:'watch',metrics:[m('Engagements with policy decision-makers','16','21','good',76),m('Testimonies / op-eds delivered','0','4','watch',0)]},
 {name:'Operational Efficiency',status:'pending',metrics:[m('User engagement rate (CRM & AM)','Pending','100%','pending',0),m('Cost savings from technology','Pending','$100,000','pending',0)]},
 {name:'Enterprise Priorities',status:'watch',metrics:[m('Department workplans approved','5','7','watch',71),m('Priority initiatives on track','8','10','good',80)]}
];
// Each domain has a coherent sample tactic → project → weekly commitment path.
const work={
 'Resident Impact':{department:'Resident Services',owner:'Director of Resident Services',tactic:'Expand access to resident services',project:'Resident engagement and service connection plan',outcome:'Connect more households with services that support stability and well-being.',deliverable:'Resident outreach calendar and service referral guide',priority:'Complete the pilot community outreach plan',result:'A reviewed outreach calendar for three pilot communities.',support:'Property Management Director: confirm community access and outreach dates.'},
 'Financial Health':{department:'Finance',owner:'Chief Financial Officer',tactic:'Strengthen cash management and collections',project:'Receivables recovery and cash forecast',outcome:'Improve collections and visibility into near-term cash needs.',deliverable:'Receivables action register and rolling cash forecast',priority:'Review the highest-priority receivables',result:'A recovery action and accountable position assigned to each priority balance.',support:'Property Management Director: validate recovery actions.'},
 'Talent Management':{department:'Human Resources',owner:'Director of Human Resources',tactic:'Improve employee experience and retention',project:'Employee feedback action plan',outcome:'Turn employee feedback into specific improvements to the working experience.',deliverable:'Department feedback themes and agreed improvement actions',priority:'Validate the three leading employee feedback themes',result:'Three documented themes with proposed actions ready for leadership review.',support:'Department leaders: review feedback themes and proposed actions.'},
 'Pipeline':{department:'Real Estate Development',owner:'Director of Real Estate Development',tactic:'Advance the housing development pipeline',project:'Development readiness and delivery plan',outcome:'Move priority housing opportunities through readiness and delivery milestones.',deliverable:'Readiness checklist and milestone schedule for priority developments',priority:'Complete the development readiness review',result:'A reviewed checklist documenting outstanding items and next milestones.',support:'Chief Financial Officer: confirm financing assumptions.'},
 'Portfolio Performance':{department:'Property Management',owner:'Director of Property Management',tactic:'Improve portfolio operating performance',project:'Occupancy and collections improvement plan',outcome:'Address vacancy and collection barriers across priority communities.',deliverable:'Community action plans and a monthly operating review',priority:'Confirm actions for communities above vacancy targets',result:'An updated action plan for each priority community.',support:'Director of Human Resources: confirm staffing support.'},
 'Brand Visibility':{department:'Community Relations',owner:'Director of Community Relations',tactic:'Increase visibility of resident and organizational impact',project:'Resident stories and media outreach plan',outcome:'Share consistent, consent-based stories about resident and community impact.',deliverable:'Story calendar and approved outreach materials',priority:'Prepare two resident story briefs',result:'Two consent-verified briefs ready for editorial review.',support:'Director of Resident Services: coordinate participating communities.'},
 'Revenue':{department:'Community Relations',owner:'Director of Community Relations',tactic:'Grow contributed revenue',project:'Annual giving campaign delivery',outcome:'Expand philanthropic support through a coordinated annual giving campaign.',deliverable:'Campaign toolkit and stewardship schedule',priority:'Finalize the campaign champion toolkit',result:'A reviewed toolkit and briefing agenda ready for campaign champions.',support:'Chief Operating Officer: review campaign messaging.'},
 'Advocacy':{department:'Community Relations',owner:'Director of Community Relations',tactic:'Strengthen advocacy participation and influence',project:'Resident advocacy and policymaker engagement plan',outcome:'Build sustained participation in housing advocacy and policymaker engagement.',deliverable:'Engagement calendar and resident advocacy briefing',priority:'Confirm the next policymaker briefing',result:'An agreed agenda, briefing materials, and confirmed organizational participants.',support:'Chief Operating Officer: confirm leadership participation.'},
 'Operational Efficiency':{department:'Operations',owner:'Director of Operations',tactic:'Establish consistent planning and accountability practices',project:'Compass planning and accountability rollout',outcome:'Enable departments to connect strategic objectives with weekly commitments.',deliverable:'Approved scorecard layouts and a department pilot plan',priority:'Review the scorecard prototype with leadership',result:'Documented decisions on card styling and the supporting-work navigation.',support:'Chief Operating Officer: confirm the demonstration workflow.'},
 'Enterprise Priorities':{department:'Operations',owner:'Chief Operating Officer',tactic:'Activate aligned annual department workplans',project:'Department workplan review and approval',outcome:'Ensure each department has an approved workplan aligned to enterprise objectives.',deliverable:'Reviewed workplans and an approval register',priority:'Review the remaining department workplans',result:'Consolidated feedback returned to both departments awaiting approval.',support:'Department leaders: resolve outstanding alignment questions.'}
};
strategic.forEach((g,i)=>{g.id='s'+i;g.metrics.forEach((x,j)=>x.id=g.id+'m'+j)});
annual.forEach((g,i)=>{g.id='a'+i;g.work=g.name;g.metrics.forEach((x,j)=>x.id=g.id+'m'+j)});
const initiativeStatuses=['good','risk','good','good','good','good','good','good','good','watch'];
const trackedInitiatives=annual.map((g,i)=>({id:g.id,title:work[g.work].tactic,status:initiativeStatuses[i],...work[g.work]}));
const initiativeMetric=annual.find(g=>g.name==='Enterprise Priorities').metrics[1];
initiativeMetric.kind='initiative-rollup';
initiativeMetric.actual=String(trackedInitiatives.filter(i=>i.status==='good').length);
initiativeMetric.target=String(trackedInitiatives.length);
initiativeMetric.progress=Number(initiativeMetric.actual)/trackedInitiatives.length*100;
const all=[...strategic,...annual], dialog=document.querySelector('#detail'), body=document.querySelector('#detail-body');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>`<span class="badge ${s}"><span class="dot"></span>${statusLabels[s]}</span>`;
let surface='strategic',history=[],returnFocus=null;
function metricRow(x){return `<button class="metric ${x.status}" data-metric="${x.id}" aria-label="View ${esc(x.name)} details, ${statusLabels[x.status]}"><span class="metric-name"><span class="dot"></span>${esc(x.name)}</span><span class="metric-value"><strong>${esc(x.actual)}</strong> <span>/ ${esc(x.target)}</span></span><span class="track" aria-hidden="true"><span class="fill" style="--progress:${x.progress}%"></span></span><span class="chevron" aria-hidden="true">›</span></button>`}
function render(){
 document.querySelectorAll('[data-surface]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.surface===surface)));
 document.querySelector('.intro h1').textContent=surface==='weekly'?'Weekly accountability':'Enterprise scorecards';
 if(surface==='weekly'){window.CompassWeekly.mount(document.querySelector('#surface'),trackedInitiatives);return}
 const groups=surface==='strategic'?strategic:annual,metrics=groups.flatMap(g=>g.metrics),isPlan=surface==='strategic';
 document.querySelectorAll('[data-surface]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.surface===surface)));
 document.querySelector('#surface').innerHTML=`<div class="hero"><div><h2>${isPlan?'2030 Plan Scorecard':'2027 Annual Scorecard'}</h2><p>${isPlan?'Performance against the Strategic Plan · 2026 → 2030':'Enterprise performance · Organized into ten domains'}</p></div><div class="hero-meta"><span class="period">${isPlan?'Q2 2027 SNAPSHOT':'JULY 2027 YTD'}</span><br>${groups.length} ${isPlan?'pillars':'domains'} · ${metrics.length} metrics<div class="health"><span class="health-label">${isPlan?'Pillar health':'Domain health'}</span><div class="health-signals" role="group" aria-label="${isPlan?'Pillar':'Domain'} status signals">${groups.map(g=>`<button class="health-signal ${g.status}" data-group="${g.id}" title="${esc(g.name)}: ${statusLabels[g.status]}" aria-label="${esc(g.name)}: ${statusLabels[g.status]}. View details"><span class="dot" aria-hidden="true"></span></button>`).join('')}</div></div></div></div><div class="legend">${Object.keys(statusLabels).map(s=>`<span class="legend-item ${s}"><span class="dot"></span>${statusLabels[s]} <b>${metrics.filter(x=>x.status===s).length}</b></span>`).join('')}<span class="hint">Select a ${isPlan?'pillar':'domain'} or metric to explore →</span></div><div class="cards ${isPlan?'strategic':'annual'}">${groups.map((g,i)=>`<article class="card"><button class="card-head" data-group="${g.id}" aria-label="Explore ${esc(g.name)}"><span class="group-title">${isPlan?`<span class="number">0${i+1}</span>`:''}<h3>${esc(g.name)}</h3></span><span class="head-right">${badge(g.status)}<span class="chevron" aria-hidden="true">›</span></span></button>${g.strategies?`<div class="strategy">${g.strategies.map((s,i)=>`<span><b>${['Sustain','Grow','Shift'][i]}</b>${esc(s)}</span>`).join('')}</div>`:''}<div class="metrics">${g.metrics.map(metricRow).join('')}</div></article>`).join('')}</div><p class="footnote">${isPlan?'Five pillars · Nineteen illustrative 2030 KPIs · Quarterly review against the five-year plan.':'Ten domains · Thirty-seven illustrative metrics · Monthly review against annual targets.'}<br>Bars show target progress, or ceiling usage where noted in metric details. Status reflects illustrative review judgments and is independent of bar length. All values are sample data.</p>`;
}
const link=(kind,id,label,sub,tag)=>`<button class="linked" data-step="${kind}" data-id="${id}"><span><small>${tag}</small><strong>${esc(label)}</strong>${sub?`<p>${esc(sub)}</p>`:''}</span><span class="chevron" aria-hidden="true">›</span></button>`;
const row=(label,value)=>`<div class="meta-row"><span>${label}</span><strong>${esc(value)}</strong></div>`;
function push(state){history.push(state);renderDetail()}
function context(id){let g=all.find(g=>g.id===id||g.metrics.some(x=>x.id===id));return {g,x:g.metrics.find(x=>x.id===id),w:work[g.work]}}
function renderDetail(){
 const state=history.at(-1),{g,x,w}=context(state.id),isPlan=g.id.startsWith('s');
 document.querySelector('#back').disabled=history.length<2;
 let html='';
 if(state.kind==='group'){
  html=`<p class="eyebrow">${isPlan?'2030 Strategic Plan / Pillar':'Annual Scorecard / Domain'}</p><h2 id="detail-title" tabindex="-1">${esc(g.name)}</h2>${badge(g.status)}<p class="detail-summary">${isPlan?'Long-term outcomes and the enterprise strategies supporting them.':'Current-year performance and the departmental work supporting it.'}</p>${g.strategies?`<div class="detail-section">${g.strategies.map((s,i)=>row(['Sustain','Grow','Shift'][i],s)).join('')}</div>`:''}<div class="detail-section"><h3>Performance measures</h3><div class="detail-metrics">${g.metrics.map(metricRow).join('')}</div></div><div class="detail-section"><h3>Explore an example contribution</h3>${link('tactic',g.id,w.tactic,w.department,'Department workplan')}</div>`;
 }else if(state.kind==='metric'){
  html=`<p class="eyebrow">${esc(g.name)} / Metric</p><h2 id="detail-title" tabindex="-1">${esc(x.name)}</h2>${badge(x.status)}<div class="snapshot"><div class="stat"><small>${isPlan?'Recorded actual':'Year-to-date actual'}</small><strong>${esc(x.actual)}</strong></div><div class="stat"><small>${isPlan?'2030 target':'2027 target'}</small><strong>${esc(x.target)}</strong></div></div>${row('Reporting period',isPlan?'Q2 2027':'July 2027 YTD')}${row('Review cadence',isPlan?'Quarterly':'Monthly')}${row('Measure interpretation',x.rule)}<p class="detail-summary">${x.status==='pending'?'This measure is awaiting a recorded value or agreed target. Pending is shown separately from performance status.':'This snapshot demonstrates the actual, target, and reviewed status shown on the scorecard. Status is an illustrative assessment of pace and delivery risk.'}</p><div class="detail-section"><h3>Supporting departmental work</h3>${link('tactic',x.id,w.tactic,w.department+' · '+w.owner,'Illustrative contribution')}</div><div class="note">Supporting work explains the contribution to an outcome. Completing a task does not automatically change the KPI actual or scorecard status.</div>`;
 }else if(state.kind==='initiative'){
  const initiative=trackedInitiatives.find(i=>i.id===state.id);
  html=`<p class="eyebrow">Enterprise priority / ${esc(g.name)}</p><h2 id="detail-title" tabindex="-1">${esc(initiative.title)}</h2>${badge(initiative.status)}<p class="detail-summary">${esc(w.outcome)}</p><div class="detail-section">${row('Accountable position',w.owner)}${row('Department',w.department)}${row('Tracking period','2027')}</div><div class="detail-section"><h3>Supporting project</h3>${link('project',state.id,w.project,w.deliverable,'Project plan')}</div><button class="linked" data-open-weekly="${state.id}"><span><small>Weekly accountability</small><strong>Open weekly priorities and action items</strong></span><span aria-hidden="true">›</span></button>`;
 }else if(state.kind==='tactic'){
  html=`<p class="eyebrow">${esc(w.department)} / Department workplan</p><h2 id="detail-title" tabindex="-1">${esc(w.tactic)}</h2>${badge('good')}<p class="detail-summary">${esc(w.outcome)}</p><div class="detail-section">${row('Accountable position',w.owner)}${row('Planning window','January – December 2027')}${row('Workplan approval','COO approved · Sample')}${row('Scorecard context',g.name)}</div><div class="detail-section"><h3>Individual project plan</h3>${link('project',state.id,w.project,'1 project · 3 milestones · 2 weekly commitments','Execution')}</div><div class="note">This is a sample alignment path for the demonstration. Enterprise objective mappings will be confirmed against the approved plan.</div>`;
 }else if(state.kind==='project'){
  html=`<p class="eyebrow">${esc(w.department)} / Project plan</p><h2 id="detail-title" tabindex="-1">${esc(w.project)}</h2>${badge('good')}<p class="detail-summary">${esc(w.outcome)}</p><div class="detail-section">${row('Project owner',w.owner)}${row('Key deliverable',w.deliverable)}</div><div class="detail-section"><h3>Project milestones</h3><div class="milestone"><span class="marker">✓</span><div>Scope and desired outcome agreed<small>June 2027 · Complete</small></div></div><div class="milestone"><span class="marker">2</span><div>${esc(w.deliverable)}<small>July 2027 · In progress</small></div></div><div class="milestone"><span class="marker">3</span><div>Review delivery and confirm next actions<small>August 2027 · Planned</small></div></div></div><div class="detail-section"><h3>Weekly accountability</h3>${link('weekly',state.id,'View this week’s commitments','July 12–16, 2027 · '+w.owner,'2 priorities')}</div>`;
 }else{
  html=`<p class="eyebrow">Weekly accountability / July 12–16, 2027</p><h2 id="detail-title" tabindex="-1">This week’s commitments</h2><p class="detail-summary">${esc(w.owner)} · ${esc(w.department)}</p><div class="commitment"><p class="eyebrow">Priority 01</p><h3>${esc(w.priority)}</h3><p><strong>Desired result:</strong> ${esc(w.result)}</p>${badge('good')}${row('Support needed',w.support)}${row('Latest update','Draft prepared; review scheduled.')}</div><div class="commitment"><p class="eyebrow">Priority 02</p><h3>Resolve open milestone dependencies</h3><p><strong>Desired result:</strong> Confirm the next milestone date and a responsible position for each outstanding dependency.</p>${badge('watch')}${row('Support needed','Department leadership: confirm timing and availability.')}${row('Latest update','One dependency is awaiting confirmation.')}</div><button class="linked" data-open-weekly="${g.id}"><span><small>Weekly accountability</small><strong>Open weekly input and rollup</strong></span><span aria-hidden="true">›</span></button><div class="note">Linked project: ${esc(w.project)}. Example commitments shown above; the weekly workspace saves demo entries in this browser.</div>`;
 }
 if(state.kind==='metric'&&x.kind==='initiative-rollup'){
  html=html.replace('<div class="detail-section"><h3>Supporting departmental work</h3>',`<div class="detail-section"><h3>All tracked priorities · ${trackedInitiatives.length}</h3><p class="detail-summary">${initiativeMetric.actual} on track · ${trackedInitiatives.filter(i=>i.status==='watch').length} watch · ${trackedInitiatives.filter(i=>i.status==='risk').length} off track</p>${trackedInitiatives.map(i=>`<button class="linked initiative-row" data-step="initiative" data-id="${i.id}"><span><strong>${esc(i.title)}</strong><p>${esc(i.owner)}</p></span>${badge(i.status)}</button>`).join('')}</div><div class="detail-section"><h3>Supporting departmental work</h3>`);
 }
 body.innerHTML=html;dialog.scrollTop=0;document.querySelector('#detail-title').focus({preventScroll:true});
}
document.addEventListener('click',e=>{
 const weeklyLink=e.target.closest('[data-open-weekly]');if(weeklyLink){dialog.close();surface='weekly';render();window.CompassWeekly.selectInitiative(annual.find(a=>a.work===context(weeklyLink.dataset.openWeekly).g.work).id);return}
 const tab=e.target.closest('[data-surface]');if(tab){surface=tab.dataset.surface;render();return}
 const b=e.target.closest('[data-group],[data-metric],[data-step]');if(!b)return;
 if(!dialog.open){returnFocus=b;history=[];dialog.showModal();document.body.style.overflow='hidden'}
 push({kind:b.dataset.group?'group':b.dataset.metric?'metric':b.dataset.step,id:b.dataset.group||b.dataset.metric||b.dataset.id});
});
document.querySelector('#back').addEventListener('click',()=>{if(history.length>1){history.pop();renderDetail()}});
document.querySelector('#close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right)dialog.close()}});
dialog.addEventListener('close',()=>{document.body.style.overflow='';returnFocus?.focus({preventScroll:true})});
render();
</script>
</body>
</html>
